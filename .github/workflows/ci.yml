name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  test-and-package:
    name: Test & Package Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Multi-Module Maven Tests
        run: mvn clean test

      - name: Package Microservice JARs
        run: mvn package -DskipTests

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: |
            eureka-server/target/*.jar
            api-gateway/target/*.jar
            order-service/target/*.jar
            inventory-service/target/*.jar
            notification-service/target/*.jar
          retention-days: 1

  docker-build-push:
    name: Build & Push Docker Images
    needs: test-and-package
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: eureka-server
            context: ./eureka-server
          - name: api-gateway
            context: ./api-gateway
          - name: order-service
            context: ./order-service
          - name: inventory-service
            context: ./inventory-service
          - name: notification-service
            context: ./notification-service
          - name: frontend
            context: ./frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Built JARs
        if: matrix.service.name != 'frontend'
        uses: actions/download-artifact@v4
        with:
          name: service-jars
          path: .

      - name: Compute Lowercase Image Tags
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER_LOWER}/${{ matrix.service.name }}"
          echo "TAG_LATEST=${IMAGE}:latest" >> $GITHUB_ENV
          echo "TAG_SHA=${IMAGE}:${{ github.sha }}" >> $GITHUB_ENV

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: |
            ${{ env.TAG_LATEST }}
            ${{ env.TAG_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  summary:
    name: Pipeline Summary
    needs: [test-and-package, docker-build-push]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate Run Summary
        run: |
          echo "### 🚀 CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Maven Test & Package | ${{ needs.test-and-package.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build & Push | ${{ needs.docker-build-push.result == 'success' && '✅ Published' || (needs.docker-build-push.result == 'skipped' && '⏭️ Skipped (PR)' || '❌ Failed') }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by commit: \`${{ github.sha }}\` on \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
